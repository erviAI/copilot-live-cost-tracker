name: Dependabot auto-merge

# Enables auto-merge on Dependabot dev-dependency patch/minor PRs. GitHub still
# holds the merge until the required CI checks pass. Production deps and majors
# are left for manual review — better-sqlite3 is a native binding whose ABI must
# match the user's system Node, which CI cannot prove.

on: pull_request

# Dependabot runs get a read-only token by default; this grants just enough to merge.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
